services:
  app:
    build: .
    image: rahmann1992/my-service:latest
    container_name: my-service-app
    ports:
      - "9091:9090"
    environment:
      DB_HOST: my-service-db
      POSTGRES_DB: myservice
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my-service-network

  db:
    image: postgres:16
    container_name: my-service-db
    environment:
      POSTGRES_DB: myservice
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d myservice"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - my-service-network

networks:
  my-service-network:
    driver: bridge

volumes:
  postgres-data:
